/* ============================================================
   KRYSTAL — stránka 404
   Sdílené bloky (tokeny, reset, hlavička, menu, CTA flip systém)
   jsou zkopírované z o-nas.html — stejný vzor samostatných HTML
   souborů bez buildu jako zbytek webu.
   ============================================================ */

/* --- 1. Design tokeny ------------------------------------- */
:root{
  --orange:#ee7c21;
  --orange-dark:#d76812;
  --ink:#2b2b2b;
  --ink-soft:#5b5b5f;
  --line:#e6e6e8;
  --white:#fff;

  --header-h:100px;
  --header-h-sm:72px;

  --gap:clamp(20px, 5vw, 64px);
  --container:1560px;

  --font-display:"Michroma", "Saira", "Segoe UI", sans-serif;
  --font-ui:"Saira", "Segoe UI", system-ui, sans-serif;

  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
}

/* --- 2. Reset --------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font-ui);
  font-weight:300;
  font-size:18px;
  line-height:1.55;
  color:var(--ink);
  background:#fff;
  overflow-x:hidden;
}
body.is-locked{overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,p{margin:0}

.container{
  width:100%;
  max-width:var(--container);
  margin-inline:auto;
  padding-inline:var(--gap);
}

.skip-link{
  position:absolute;left:-9999px;top:0;z-index:200;
  background:var(--ink);color:#fff;padding:12px 20px;
}
.skip-link:focus{left:0}

:where(a,button):focus-visible{
  outline:2px solid var(--orange);
  outline-offset:4px;
  border-radius:4px;
}

/* --- 3. Hlavička ------------------------------------------ */
.site-header{
  position:sticky; top:0; z-index:100;
  height:var(--header-h);
  background:var(--white);
  box-shadow:0 1px 0 var(--line);
}
.header-inner{
  display:flex; align-items:center; gap:clamp(16px,3vw,48px);
  height:100%;
}
.brand{display:flex;align-items:center;flex:0 0 auto}
.brand img,.brand svg{height:clamp(30px,3.4vw,44px); width:auto}

/* --- 4. Sekce 404 ------------------------------------------ */
.notfound{
  min-height:calc(100svh - var(--header-h));
  display:flex;align-items:center;
  background:var(--ink);
}
.notfound-inner{text-align:center;padding:clamp(64px,10vw,110px) 0}
.notfound-code{
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(4rem,12vw,8rem);
  line-height:1;
  color:var(--orange);
}
.notfound-title{
  margin-top:12px;
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(1.5rem,3vw,2.2rem);
  color:#fff;
}
.notfound-text{
  margin:16px auto 0;
  max-width:52ch;
  font-size:1rem;
  line-height:1.7;
  color:rgba(255,255,255,.66);
}
.notfound-actions{
  margin-top:clamp(28px,3.6vw,36px);
  display:flex;flex-wrap:wrap;gap:14px;
  justify-content:center;
}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 32px;
  background:var(--orange);color:#fff;
  font-weight:500;font-size:clamp(15px,1.15vw,17px);letter-spacing:.015em;
  transition:background-color .25s var(--ease-out);
}
.btn:hover{background:var(--orange-dark)}
.btn-ghost{
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 32px;
  border:1px solid rgba(255,255,255,.35);color:#fff;
  font-weight:500;font-size:clamp(15px,1.15vw,17px);letter-spacing:.015em;
  transition:border-color .25s var(--ease-out), background-color .25s var(--ease-out);
}
.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.6)}

@media (max-width:640px){
  :root{--header-h:72px}
  body{font-size:17px}
  .notfound-actions{flex-direction:column;align-items:stretch}
  .notfound-actions a{justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}

<body>
<a class="skip-link" href="#obsah">Přeskočit na obsah</a>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html" aria-label="Krystal — domů">
      <img src="logo_transparent.png" alt="Krystal" width="1564" height="308" decoding="async">
    </a>
  </div>
</header>

<main id="obsah">
  <section class="notfound">
    <div class="container notfound-inner">
      <div class="notfound-code" aria-hidden="true">404</div>
      <h1 class="notfound-title">Tuhle stránku jsme nenašli</h1>
      <p class="notfound-text">
        Odkaz je možná zastaralý, nebo jste si v adrese někde překlepli.
        Zkuste se vrátit na hlavní stránku, nebo nás rovnou kontaktujte.
      </p>
      <div class="notfound-actions">
        <a class="btn" href="index.html">Na hlavní stránku</a>
        <a class="btn-ghost" href="kontakt.html">Kontaktovat nás</a>
      </div>
    </div>
  </section>
</main>
</body>
